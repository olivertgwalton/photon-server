# The Linux build of Photon: the server, from a linux release archive the release workflow puts
# here as photon-server.tar.gz, with a PostgreSQL and a Valkey of its own, which photon.sh starts
# beside it.
id: io.github.olivertgwalton.Photon
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: photon
finish-args:
  - --share=network
  # Libraries may be anywhere: a home folder, /mnt, /media, /srv. They are read, never written.
  - --filesystem=host:ro
  # The GPU, for VAAPI, Quick Sync and NVENC.
  - --device=all
modules:
  - name: postgresql
    buildsystem: simple
    build-commands:
      # Only a socket in the app's own folder reaches it, so it has no TLS; ICU is the runtime's.
      - ./configure --prefix=/app --with-icu --without-readline --without-openssl
      - make -j"$FLATPAK_BUILDER_N_JOBS" world-bin
      - make install-world-bin
    cleanup: [/include, /lib/pkgconfig, "*.a"]
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2
        sha256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
  - name: valkey
    buildsystem: simple
    build-commands:
      - make -j"$FLATPAK_BUILDER_N_JOBS" BUILD_TLS=no valkey-server
      - install -Dm755 src/valkey-server /app/bin/valkey-server
    sources:
      - type: archive
        url: https://github.com/valkey-io/valkey/archive/refs/tags/9.1.2.tar.gz
        sha256: 19c23908e7d57e8d91ef85b41f5646307582f10f4f0fb999bbf89ed24ec9c983
  - name: photon-server
    buildsystem: simple
    build-commands:
      - install -Dm755 -t /app/bin bin/*
      - mkdir -p /app/share && cp -R share/photon-server /app/share/
      - install -Dm644 LICENSE /app/share/licenses/photon-server/LICENSE
      - install -Dm755 photon.sh /app/bin/photon
      - install -Dm644 io.github.olivertgwalton.Photon.desktop -t /app/share/applications
      - install -Dm644 io.github.olivertgwalton.Photon.metainfo.xml -t /app/share/metainfo
      - install -Dm644 favicon.svg /app/share/icons/hicolor/scalable/apps/io.github.olivertgwalton.Photon.svg
    sources:
      - type: archive
        path: photon-server.tar.gz
      - type: file
        path: photon.sh
      - type: file
        path: io.github.olivertgwalton.Photon.desktop
      - type: file
        path: io.github.olivertgwalton.Photon.metainfo.xml
      - type: file
        path: ../web/static/favicon.svg
