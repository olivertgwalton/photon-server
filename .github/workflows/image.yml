name: image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Check each architecture's ffmpeg in the image
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" -t check .
            docker run --rm --platform "$platform" -v "$PWD/deploy/verify-ffmpeg.sh:/verify.sh:ro" \
              --entrypoint bash check /verify.sh
            # The server finds and accepts the tools before it needs a database.
            docker run --rm --platform "$platform" -e PHOTON_DATABASE_URL=postgres://none/none \
              -e PHOTON_VALKEY_URL=valkey://none:6379 check 2>&1 | tee run.log || true
            grep -q '"msg":"media tools"' run.log
          done
      - name: Run the compose stack on the image until it is ready
        env:
          PHOTON_IMAGE: check
          POSTGRES_PASSWORD: ci
          VALKEY_PASSWORD: ci
        run: |
          docker buildx build --load --platform linux/amd64 -t check .
          MEDIA_DIR="$(mktemp -d)"
          export MEDIA_DIR
          docker compose -f deploy/compose.yml up -d --wait server
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8640/readyz)" = 204 ] && exit 0
            sleep 2
          done
          docker compose -f deploy/compose.yml logs
          exit 1
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
  web-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-web:main
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
