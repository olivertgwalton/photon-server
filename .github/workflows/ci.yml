name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # An S3 gateway over a folder, which checks each request's signature as S3 does.
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: photon
          ROOT_SECRET_KEY: photonsecret
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ["7070:7070"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_VALKEY_URL: valkey://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:7070
      TEST_S3_BUCKET: photon
      AWS_ACCESS_KEY_ID: photon
      AWS_SECRET_ACCESS_KEY: photonsecret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Make the test bucket
        run: |
          for try in $(seq 30); do
            aws --endpoint-url http://localhost:7070 s3 mb s3://photon && exit 0
            sleep 1
          done
          exit 1
      - run: go build ./...
      - run: go test -tags integration -race -shuffle=on -count=1 ./...
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go fix -diff ./...
  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(go run golang.org/x/tools/cmd/deadcode@v0.51.0 -test -tags integration ./...)"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: The API's types match the server's routes
        run: bun run api && git diff --exit-code src/lib/api/schema.d.ts
      - run: bun run check
      - run: bun run lint
      - run: bun test src
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
