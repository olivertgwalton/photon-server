name: release
on:
  push:
    tags: ["v*"]
  # A change to how archives are made builds and runs them without publishing.
  pull_request:
    paths: [.github/workflows/release.yml, deploy/fetch-tools.sh, deploy/fetch-jellyfin-web.sh, macos/**, flatpak/**, windows/**, cmd/photon-tray/**]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          goos=${TARGET%/*} goarch=${TARGET#*/}
          exe=
          [ "$goos" = windows ] && exe=.exe
          # Laid out as an install is: the web apps are found in ../share/photon-server from the
          # binary, and the tools beside it.
          root=photon-server
          mkdir -p "$root/bin" "$root/share/photon-server" "$root/share/licenses/jellyfin-ffmpeg"
          (cd web && bun install --frozen-lockfile && bun run build)
          cp -R web/build "$root/share/photon-server/web"
          CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" -o "$root/bin/photon-server$exe" ./cmd/photon-server
          deploy/fetch-tools.sh "$goos" "$goarch" "$root/bin"
          deploy/fetch-jellyfin-web.sh "$root/share/photon-server/jellyfin-web" "$root/share/licenses/jellyfin-web"
          cp LICENSE "$root/LICENSE"
          cp deploy/ffmpeg-NOTICE "$root/share/licenses/jellyfin-ffmpeg/NOTICE"
          name="photon-server_${VERSION}_${goos}_${goarch}"
          if [ "$goos" = windows ]; then
            zip -qr "$name.zip" "$root"
          else
            tar -czf "$name.tar.gz" "$root"
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # Each archive that has a runner of its own starts there and finds the tools it carries.
  run:
    needs: archive
    strategy:
      matrix:
        include:
          - { target: linux_amd64, runner: ubuntu-26.04 }
          - { target: linux_arm64, runner: ubuntu-26.04-arm }
          - { target: darwin_arm64, runner: macos-latest }
          - { target: windows_amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_${{ matrix.target }}"
          merge-multiple: true
      - name: Start the server until it has found its tools
        env:
          PHOTON_DATABASE_URL: postgres://none/none
          PHOTON_VALKEY_URL: valkey://none:6379
        run: |
          for f in photon-server_*; do
            case "$f" in *.zip) unzip -q "$f" ;; *) tar -xzf "$f" ;; esac
          done
          photon-server/bin/photon-server > run.log 2>&1 || true
          cat run.log
          grep '"msg":"media tools"' run.log | grep -Eq 'photon-server.{1,2}bin.{1,2}ffmpeg'
          grep '"msg":"media tools"' run.log | grep -q '"yt_dlp_version":"20'
      # Run by the service manager, it logs to its cache folder and, finding no database, stops
      # failed with its own exit code, which is what starts a service's recovery actions.
      - name: Run it as a Windows service
        if: matrix.target == 'windows_amd64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path photon-server\bin\photon-server.exe).Path
          sc.exe create photon-server binPath= "`"$exe`"" start= demand
          reg add HKLM\SYSTEM\CurrentControlSet\Services\photon-server /v Environment /t REG_MULTI_SZ /f `
            /d "PHOTON_DATABASE_URL=postgres://none/none\0PHOTON_VALKEY_URL=valkey://none:6379"
          sc.exe start photon-server
          $log = "$env:SystemRoot\System32\config\systemprofile\AppData\Local\photon-server\photon-server.log"
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"msg":"photon-server stopped"' -Quiet)) { break }
            Start-Sleep 2
          }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '"msg":"media tools"' -Quiet)) { exit 1 }
          Start-Sleep 2
          $state = sc.exe query photon-server | Out-String
          $state
          if ($state -notmatch 'SERVICE_EXIT_CODE\s*:\s*1\s') { exit 1 }

  # Photon.app, the menu-bar app that runs the server beside its own PostgreSQL and Valkey, in a
  # DMG for Apple silicon: signed with the Developer ID and notarized where the secrets are set, as a tag requires. The secrets:
  # MACOS_CERTIFICATE, the Developer ID Application certificate and key as a base64 .p12, and
  # MACOS_CERTIFICATE_PASSWORD; APPLE_API_KEY, an App Store Connect API key's .p8 in base64, with
  # APPLE_API_KEY_ID and APPLE_API_ISSUER_ID.
  dmg:
    needs: archive
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_darwin_arm64"
          merge-multiple: true
      # PostgreSQL and Valkey are built again only when the versions build-services.sh pins change.
      - uses: actions/cache@v6
        id: services
        with:
          path: services
          key: services-${{ hashFiles('macos/build-services.sh') }}
      - name: Build PostgreSQL and Valkey
        if: steps.services.outputs.cache-hit != 'true'
        run: |
          brew install icu4c@78
          macos/build-services.sh services
      - name: Build the app
        run: |
          tar -xzf photon-server_*.tar.gz
          macos/build-app.sh "$VERSION" photon-server services .
      - name: Sign the app
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          sign() { codesign --force --timestamp --options runtime --sign "$identity" "$@"; }
          res=Photon.app/Contents/Resources
          sign --entitlements macos/yt-dlp.entitlements "$res/photon-server/bin/yt-dlp"
          find "$res" -type f ! -name yt-dlp | while read -r f; do
            if file "$f" | grep -q Mach-O; then sign "$f"; fi
          done
          sign Photon.app
          codesign --verify --strict --verbose=2 Photon.app
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Make the DMG
        run: |
          mkdir dmg
          cp -R Photon.app dmg/
          ln -s /Applications dmg/Applications
          name="photon-server_${VERSION}_darwin_arm64.dmg"
          hdiutil create -volname Photon -srcfolder dmg -fs HFS+ -format UDZO "$name"
          echo "DMG=$name" >> "$GITHUB_ENV"
      - name: Notarize the DMG
        if: env.MACOS_CERTIFICATE != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          codesign --timestamp --sign "$IDENTITY" "$DMG"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
      - name: A tag's DMG is signed
        if: github.ref_type == 'tag' && env.MACOS_CERTIFICATE == ''
        run: |
          echo "set the MACOS_CERTIFICATE and APPLE_API_KEY secrets to publish a signed DMG" >&2
          exit 1
      # Opened from the DMG, the app makes its database, starts PostgreSQL, Valkey and the server,
      # and serves the web app; quit, it stops all three.
      - name: Run the app from the DMG
        run: |
          hdiutil attach "$DMG" -mountpoint /Volumes/Photon -nobrowse
          /Volumes/Photon/Photon.app/Contents/MacOS/Photon &
          for _ in $(seq 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8640/health)" = 204 ] && break
            sleep 2
          done
          cat ~/Library/Logs/Photon/*.log
          curl -fsS localhost:8640/auth/login | grep -q 'kit.start'
          osascript -e 'tell application id "io.github.olivertgwalton.photon" to quit'
          for _ in $(seq 20); do pgrep -f Photon.app >/dev/null || exit 0; sleep 1; done
          pgrep -lf Photon.app
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  # Photon for Windows: the tray app that runs the server beside its own PostgreSQL and Valkey, in
  # an installer that asks for no admin. Valkey has no Windows build of its own, so the one built
  # here under MSYS2 passes the kv package's tests before it is carried.
  windows:
    needs: archive
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: >-
            gcc make curl unzip
            mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-imagemagick
      - name: Find makensis
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_windows_amd64"
          merge-multiple: true
      # PostgreSQL and Valkey are built again only when the versions build-services.sh pins change.
      - uses: actions/cache@v6
        id: services
        with:
          path: services
          key: windows-services-${{ hashFiles('windows/build-services.sh') }}
      - name: Build PostgreSQL and Valkey
        if: steps.services.outputs.cache-hit != 'true'
        run: windows/build-services.sh services
      - name: Valkey passes the kv tests
        env:
          TEST_VALKEY_URL: valkey://127.0.0.1:6379
        run: |
          services/valkey/bin/valkey-server.exe --port 6379 --save "" --appendonly no > valkey.log 2>&1 &
          trap 'kill $!' EXIT
          go test -tags integration -count=1 ./internal/kv/ || { cat valkey.log; exit 1; }
      - name: Build the installer
        run: |
          unzip -q photon-server_*.zip
          PATH="$PATH:/ucrt64/bin" windows/build-app.sh "$VERSION" photon-server services .
          echo "SETUP=photon-server_${VERSION}_windows_amd64_setup.exe" >> "$GITHUB_ENV"
      # Installed, it starts Photon, which makes its database, starts PostgreSQL, Valkey and the
      # server, and serves the web app. Installed again over it, as an update is, it quits Photon,
      # replaces it and starts it again on the same database. Closed, Photon stops all three.
      - name: Install and run it
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Photon"
          $logs = "$env:LOCALAPPDATA\Photon\logs"
          function Install {
            (Start-Process -FilePath ".\$env:SETUP" -ArgumentList '/S' -PassThru).WaitForExit()
            for ($i = 0; $i -lt 90; $i++) {
              try {
                if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://localhost:8640/health).StatusCode -eq 204) { return }
              } catch {}
              Start-Sleep 2
            }
            Get-Content "$logs\*.log"
            exit 1
          }
          Install
          Install
          if (-not ((Invoke-WebRequest -UseBasicParsing http://localhost:8640/auth/login).Content -match 'kit.start')) { exit 1 }
          taskkill /im Photon.exe
          for ($i = 0; $i -lt 60; $i++) {
            $left = Get-Process | Where-Object { $_.Path -like "$app\*" }
            if (-not $left) { break }
            Start-Sleep 1
          }
          Get-Content "$logs\*.log"
          if ($left) { $left | Format-Table Id, Path; exit 1 }
          # Each time, photon-server stopped when it was told to rather than being ended.
          if ((Select-String -Path "$logs\photon.log" -Pattern '"msg":"photon-server exited","command":"serve","exit":0').Count -ne 2) { exit 1 }
          if (Select-String -Path "$logs\photon.log" -Pattern 'not stopped when told' -Quiet) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SETUP }}
          path: ${{ env.SETUP }}
          if-no-files-found: error

  # The Linux build: a Flatpak carrying the server with its own PostgreSQL and Valkey. Run, it makes
  # its database, serves the web app, and stops all three when told to.
  flatpak:
    needs: archive
    strategy:
      matrix:
        include:
          - { arch: x86_64, goarch: amd64, runner: ubuntu-26.04 }
          - { arch: aarch64, goarch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      BUNDLE: photon-server_${{ github.ref_type == 'tag' && github.ref_name || github.sha }}_linux_${{ matrix.goarch }}.flatpak
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_linux_${{ matrix.goarch }}"
          merge-multiple: true
      - run: mv photon-server_*.tar.gz flatpak/photon-server.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: flatpak/io.github.olivertgwalton.Photon.yml
          arch: ${{ matrix.arch }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  # Each bundle is installed and run on its own runner, as a desktop runs it: by a user, as
  # PostgreSQL will not run as root, which the build's container is.
  flatpak-run:
    needs: flatpak
    strategy:
      matrix:
        include:
          - { goarch: amd64, runner: ubuntu-26.04 }
          - { goarch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_linux_${{ matrix.goarch }}.flatpak"
          merge-multiple: true
      - name: Run it
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive ./*.flatpak
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$XDG_RUNTIME_DIR"
          flatpak run io.github.olivertgwalton.Photon &
          for _ in $(seq 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8640/health)" = 204 ] && break
            sleep 2
          done
          cat ~/.var/app/io.github.olivertgwalton.Photon/data/photon/logs/*.log
          curl -fsS localhost:8640/auth/login | grep -q 'kit.start'
          # Stopping flatpak run would kill the sandbox outright: the launcher inside is asked.
          pkill -TERM -f '/app/bin/photon$'
          for _ in $(seq 30); do
            pgrep -f '/app/bin/(postgres|valkey-server|photon-server)' >/dev/null || exit 0
            sleep 1
          done
          pgrep -af '/app/bin/'
          exit 1

  publish:
    if: github.ref_type == 'tag'
    needs: [run, dmg, windows, flatpak-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes photon-server[_-]*
