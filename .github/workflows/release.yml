name: release
on:
  push:
    tags: ["v*"]
  # A change to how archives are made builds and runs them without publishing.
  pull_request:
    paths: [.github/workflows/release.yml, deploy/fetch-tools.sh, deploy/linux/**]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          goos=${TARGET%/*} goarch=${TARGET#*/}
          exe=
          [ "$goos" = windows ] && exe=.exe
          # Laid out as an install is: the web app is found at ../share/photon-server/web from the
          # binary, and the tools beside it.
          root=photon-server
          mkdir -p "$root/bin" "$root/share/photon-server" "$root/share/licenses/jellyfin-ffmpeg"
          (cd web && bun install --frozen-lockfile && bun run build)
          cp -R web/build "$root/share/photon-server/web"
          CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" -o "$root/bin/photon-server$exe" ./cmd/photon-server
          deploy/fetch-tools.sh "$goos" "$goarch" "$root/bin"
          cp LICENSE "$root/LICENSE"
          cp deploy/ffmpeg-NOTICE "$root/share/licenses/jellyfin-ffmpeg/NOTICE"
          name="photon-server_${VERSION}_${goos}_${goarch}"
          if [ "$goos" = windows ]; then
            zip -qr "$name.zip" "$root"
          else
            tar -czf "$name.tar.gz" "$root"
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # Each archive that has a runner of its own starts there and finds the tools it carries.
  run:
    needs: archive
    strategy:
      matrix:
        include:
          - { target: linux_amd64, runner: ubuntu-latest }
          - { target: linux_arm64, runner: ubuntu-24.04-arm }
          - { target: darwin_arm64, runner: macos-latest }
          - { target: windows_amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_${{ matrix.target }}"
          merge-multiple: true
      - name: Start the server until it has found its tools
        env:
          PHOTON_DATABASE_URL: postgres://none/none
          PHOTON_VALKEY_URL: valkey://none:6379
        run: |
          for f in photon-server_*; do
            case "$f" in *.zip) unzip -q "$f" ;; *) tar -xzf "$f" ;; esac
          done
          photon-server/bin/photon-server > run.log 2>&1 || true
          cat run.log
          grep '"msg":"media tools"' run.log | grep -Eq 'photon-server.{1,2}bin.{1,2}ffmpeg'
          grep '"msg":"media tools"' run.log | grep -q '"yt_dlp_version":"20'
      # Run by the service manager, it logs to its cache folder and, finding no database, stops
      # failed with its own exit code, which is what starts a service's recovery actions.
      - name: Run it as a Windows service
        if: matrix.target == 'windows_amd64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path photon-server\bin\photon-server.exe).Path
          sc.exe create photon-server binPath= "`"$exe`"" start= demand
          reg add HKLM\SYSTEM\CurrentControlSet\Services\photon-server /v Environment /t REG_MULTI_SZ /f `
            /d "PHOTON_DATABASE_URL=postgres://none/none\0PHOTON_VALKEY_URL=valkey://none:6379"
          sc.exe start photon-server
          $log = "$env:SystemRoot\System32\config\systemprofile\AppData\Local\photon-server\photon-server.log"
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"msg":"photon-server stopped"' -Quiet)) { break }
            Start-Sleep 2
          }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '"msg":"media tools"' -Quiet)) { exit 1 }
          Start-Sleep 2
          $state = sc.exe query photon-server | Out-String
          $state
          if ($state -notmatch 'SERVICE_EXIT_CODE\s*:\s*1\s') { exit 1 }

  package:
    needs: archive
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: "*_linux_${{ matrix.arch }}"
          merge-multiple: true
      - name: Build the .deb and .rpm from the archive
        env:
          ARCH: ${{ matrix.arch }}
          # A package's version is a number: the tag's, or 0.0.0 for a PR's.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          tar -xzf photon-server_*.tar.gz
          for p in deb rpm; do
            go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 package -f deploy/linux/nfpm.yaml -p "$p"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: packages_${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  # The .deb installs on Ubuntu, and its service migrates and serves.
  deb:
    needs: package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: photon
          POSTGRES_PASSWORD: photon
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages_amd64
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ./*.deb
      - name: Configure and start the service until it is ready
        run: |
          printf '%s\n' PHOTON_DATABASE_URL=postgres://photon:photon@localhost/photon \
            PHOTON_VALKEY_URL=valkey://localhost:6379 | sudo tee /etc/photon-server/env
          sudo systemctl start photon-server
          for _ in $(seq 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8640/readyz)" = 204 ]; then
              [ "$(ps -o uid= -C photon-server | tr -d ' ')" = "$(id -u photon-server)" ] && exit 0
              break
            fi
            sleep 2
          done
          sudo journalctl -u photon-server --no-pager
          exit 1

  # The .rpm installs on Fedora, and the server finds the tools it carries.
  rpm:
    needs: package
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages_amd64
      - run: dnf install -y --setopt=install_weak_deps=False ./*.x86_64.rpm
      - name: Start the server until it has found its tools
        env:
          PHOTON_DATABASE_URL: postgres://none/none
          PHOTON_VALKEY_URL: valkey://none:6379
        run: |
          photon-server > run.log 2>&1 || true
          cat run.log
          grep '"msg":"media tools"' run.log | grep -q '"ffmpeg":"/usr/lib/photon-server/bin/ffmpeg"'

  publish:
    if: github.ref_type == 'tag'
    needs: [run, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes photon-server[_-]*
