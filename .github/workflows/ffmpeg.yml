name: ffmpeg
on:
  pull_request:
    paths: [build/ffmpeg/**, .github/workflows/ffmpeg.yml]
  push:
    branches: [main]
    paths: [build/ffmpeg/**, .github/workflows/ffmpeg.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux64, linuxarm64]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the library image for this BtbN commit
        id: libs
        run: |
          source build/ffmpeg/versions.env
          ver="${FFMPEG_TAG#n}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}-gpl-${ver%.*}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$BTBN_COMMIT" >> "$GITHUB_OUTPUT"
          if docker pull "$image:$BTBN_COMMIT"; then
            docker tag "$image:$BTBN_COMMIT" "$image:latest"
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          fi
      - run: build/ffmpeg/build.sh ${{ matrix.target }} out
      - name: Keep the library image for the next build
        if: steps.libs.outputs.pulled != 'true'
        run: |
          docker tag "${{ steps.libs.outputs.image }}:latest" "${{ steps.libs.outputs.tag }}"
          docker push "${{ steps.libs.outputs.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/
          retention-days: 7
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish the executables beside their source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source build/ffmpeg/versions.env
          release="ffmpeg-$FFMPEG_TAG-${BTBN_COMMIT::7}"
          gh release create "$release" --target "$GITHUB_SHA" --title "$release" \
            --notes "FFmpeg $FFMPEG_TAG built with BtbN/FFmpeg-Builds@$BTBN_COMMIT (gpl variant). GPL-3.0-or-later; the source archive is the Corresponding Source." \
            out/*
