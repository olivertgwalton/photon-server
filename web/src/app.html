<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="dark">
		<meta name="theme-color" content="#0a0a0e">
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml">
		<script>
		// What a page asks first, asked as it arrives rather than once its
		// script has: every signed-in page's profile and words, and the shell's
		// libraries and plugin pages where it is drawn. Signing in, the first
		// setup page, the player and the profile picker ask fewer or none.
		{
			const [, first, second] = location.pathname.split("/");
			const signedIn = first !== "auth" && !(first === "setup" && !second);
			const inShell =
				signedIn && !["play", "profiles", "setup"].includes(first);
			const calls = [
				...(signedIn ? ["profile", "words"] : []),
				...(inShell ? ["libraries", "plugin-pages"] : []),
			];
			for (const call of calls) {
				const link = document.createElement("link");
				link.rel = "preload";
				link.as = "fetch";
				link.crossOrigin = "anonymous";
				link.href = `/api/v1/${call}`;
				document.head.append(link);
			}
		}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
